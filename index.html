<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROVEGEAR Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass-card { background: white; border-radius: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="loginOverlay">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
            <img src="GROVE_GEAR_LOGO.png" alt="Logo" class="w-32 h-32 mx-auto mb-4 object-contain">
            <h2 class="text-xl font-black text-slate-800 mb-6 uppercase tracking-tighter">Grovegear Access</h2>
            <div class="space-y-4">
                <input type="password" id="loginPass" placeholder="MASUKKAN PASSWORD" class="w-full p-4 bg-slate-100 rounded-2xl text-center outline-none focus:ring-2 focus:ring-emerald-500 font-bold tracking-widest">
                <button onclick="handleLogin()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-emerald-600 transition-all shadow-lg uppercase">Masuk Ke Sistem</button>
            </div>
            <p id="loginError" class="text-rose-500 text-[10px] mt-4 hidden font-bold uppercase">Password Salah!</p>
        </div>
    </div>

    <div id="mainApp" class="max-w-6xl mx-auto" style="display:none;">
        <header class="flex justify-between items-center mb-8 glass-card p-6 border-b-4 border-emerald-500">
            <div class="flex items-center gap-4">
                <img src="GROVE_GEAR_LOGO.png" alt="GG" class="w-12 h-12 object-contain">
                <h1 class="text-xl font-black text-slate-800 uppercase tracking-tighter">GROVEGEAR <span class="text-emerald-600">SYSTEM</span></h1>
            </div>
            <div class="flex gap-2">
                <button onclick="exportToWord()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold text-xs uppercase shadow-lg hover:bg-blue-700">Print Laporan</button>
                <button onclick="handleLogout()" class="bg-rose-100 text-rose-600 px-4 py-2 rounded-lg font-bold text-xs uppercase hover:bg-rose-200">Logout</button>
            </div>
        </header>

        <form id="cashForm" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="glass-card p-6 space-y-4">
                <h3 class="font-bold text-slate-800 flex items-center gap-2 uppercase text-sm border-b pb-2">
                    <span class="w-2 h-5 bg-emerald-500 rounded-full"></span> Pendapatan
                </h3>
                <input type="text" id="pekan" placeholder="PEKAN" class="w-full p-3 bg-slate-50 rounded-xl outline-none font-bold" required>
                <input type="number" id="saldoBank" placeholder="Saldo Bank Awal ($)" class="w-full p-3 bg-slate-50 rounded-xl outline-none" required>
                <input type="number" id="incARK" placeholder="ARK ($)" class="w-full p-3 bg-emerald-50 rounded-xl outline-none" required>
                <input type="number" id="incCosme" placeholder="Cosme ($)" class="w-full p-3 bg-emerald-50 rounded-xl outline-none" required>
                <input type="number" id="incLain" placeholder="Lain-lain ($)" class="w-full p-3 bg-emerald-50 rounded-xl outline-none" required>
            </div>

            <div class="glass-card p-6 space-y-4">
                <h3 class="font-bold text-slate-800 flex items-center gap-2 uppercase text-sm border-b pb-2">
                    <span class="w-2 h-5 bg-rose-500 rounded-full"></span> Operasional
                </h3>
                <input type="number" id="expGaji" placeholder="Gaji Mechanic ($)" class="w-full p-3 bg-rose-50 rounded-xl outline-none" required>
                <input type="number" id="expRestock" placeholder="Restock ARK ($)" class="w-full p-3 bg-rose-50 rounded-xl outline-none" required>
                <input type="number" id="expLain" placeholder="Biaya Lain ($)" class="w-full p-3 bg-rose-50 rounded-xl outline-none" required>
                <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-emerald-600 mt-4 transition-all shadow-xl">SIMPAN DATA</button>
            </div>

            <div class="glass-card p-6 flex flex-col justify-center items-center text-center">
                <p class="text-xs font-bold text-slate-400 uppercase mb-2">Net Profit (Tax 10%)</p>
                <div id="liveNet" class="text-4xl font-black text-emerald-600">$0</div>
                <div class="w-full mt-6 h-32"><canvas id="financeChart"></canvas></div>
            </div>
        </form>

        <div class="glass-card overflow-hidden mt-8">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-900 text-white text-[10px] uppercase">
                    <tr>
                        <th class="p-4">Pekan</th>
                        <th class="p-4">Arus Kas</th>
                        <th class="p-4 text-rose-400">Operasional</th>
                        <th class="p-4 text-emerald-400">Net Bersih</th>
                        <th class="p-4 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>

    <script>
        const ADMIN_EMAIL = "admin@gmail.com"; 

        const firebaseConfig = {
            apiKey: "AIzaSyDs7YY-qXbfk9sSy7NSPJOELG8ZRMBp3Go",
            authDomain: "grove-gear-finance-a9f60.firebaseapp.com",
            databaseURL: "https://grove-gear-finance-a9f60-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "grove-gear-finance-a9f60",
            appId: "1:943750735104:web:5558eb9ea90d1f280fffe5"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database().ref('records');

        let records = [];
        let chartInstance = null;

        function handleLogin() {
            const pass = document.getElementById('loginPass').value;
            auth.signInWithEmailAndPassword(ADMIN_EMAIL, pass).catch(err => {
                document.getElementById('loginError').classList.remove('hidden');
            });
        }

        function handleLogout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                loadData();
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        });

        function loadData() {
            db.on('value', (snapshot) => {
                const data = snapshot.val();
                records = data ? Object.keys(data).map(key => ({ ...data[key], id: key })) : [];
                render();
            });
        }

        document.getElementById('cashForm').addEventListener('submit', (e) => {
            e.preventDefault();
            db.push({
                pekan: document.getElementById('pekan').value.toUpperCase(),
                saldoBank: parseFloat(document.getElementById('saldoBank').value),
                ark: parseFloat(document.getElementById('incARK').value),
                cosme: parseFloat(document.getElementById('incCosme').value),
                incLain: parseFloat(document.getElementById('incLain').value),
                gaji: parseFloat(document.getElementById('expGaji').value),
                restock: parseFloat(document.getElementById('expRestock').value),
                expLain: parseFloat(document.getElementById('expLain').value),
                timestamp: Date.now()
            });
            e.target.reset();
        });

        function render() {
            let h = '';
            let chartLabels = [], chartValues = [];
            let latestNet = 0;
            records.sort((a,b) => a.timestamp - b.timestamp).forEach(r => {
                const totalOmset = r.ark + r.cosme + r.incLain;
                const totalOpr = r.gaji + r.restock + r.expLain;
                const netFinal = (totalOmset - totalOpr) * 0.9;
                latestNet = netFinal;
                chartLabels.push(r.pekan); chartValues.push(netFinal);
                h += `<tr class="hover:bg-slate-50 font-medium">
                    <td class="p-4 font-bold">${r.pekan}</td>
                    <td class="p-4 text-[10px]">ARK: $${r.ark.toLocaleString()} | COS: $${r.cosme.toLocaleString()}</td>
                    <td class="p-4 text-rose-500 font-bold">$${totalOpr.toLocaleString()}</td>
                    <td class="p-4 font-black text-emerald-600 text-lg">$${netFinal.toLocaleString()}</td>
                    <td class="p-4 text-center"><button onclick="deleteData('${r.id}')" class="text-rose-400 text-xs underline font-bold">Hapus</button></td>
                </tr>`;
            });
            document.getElementById('tableBody').innerHTML = h || '<tr><td colspan="5" class="p-10 text-center text-slate-400">Belum ada data.</td></tr>';
            document.getElementById('liveNet').innerText = '$' + latestNet.toLocaleString();
            updateChart(chartLabels, chartValues);
        }

        function updateChart(l, v) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: l, datasets: [{ data: v, borderColor: '#10b981', tension: 0.4, fill: true, backgroundColor: 'rgba(16, 185, 129, 0.1)' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { display: false } } }
            });
        }

        window.deleteData = (id) => { if(confirm('Hapus data?')) db.child(id).remove(); };

        window.exportToWord = () => {
            let content = `<h2 style="text-align:center; font-family:Arial;">LAPORAN KAS GROVE GEAR</h2>
            <table border="1" style="width:100%; border-collapse:collapse; font-family:Arial; font-size:11px;">
                <tr style="background:#eee; text-align:center; font-weight:bold;">
                    <th>PEKAN</th><th>SALDO BANK</th><th colspan="3">DETAIL ARUS KAS</th>
                </tr>`;

            records.forEach(r => {
                const totalOmset = r.ark + r.cosme + r.incLain;
                const totalOpr = r.gaji + r.restock + r.expLain;
                const netBeforeTax = totalOmset - totalOpr;
                const pajak = netBeforeTax * 0.1;
                const netFinal = netBeforeTax - pajak;

                content += `
                <tr>
                    <td rowspan="12" style="text-align:center; font-weight:bold;">${r.pekan}</td>
                    <td rowspan="12" style="text-align:center; font-weight:bold; font-size:14px;">$${r.saldoBank.toLocaleString()}</td>
                    <td rowspan="4" style="font-weight:bold; background:#f9f9f9;">PENDAPATAN</td>
                    <td>Omset ARK</td><td style="text-align:right;">$${r.ark.toLocaleString()}</td>
                </tr>
                <tr><td>Omset Cosme</td><td style="text-align:right;">$${r.cosme.toLocaleString()}</td></tr>
                <tr><td>Lain-Lain</td><td style="text-align:right;">$${r.incLain.toLocaleString()}</td></tr>
                <tr style="font-weight:bold;"><td>TOTAL OMSET</td><td style="text-align:right;">$${totalOmset.toLocaleString()}</td></tr>
                
                <tr>
                    <td rowspan="4" style="font-weight:bold; background:#f9f9f9;">OPERASIONAL</td>
                    <td>Gaji Mechanic</td><td style="text-align:right;">$${r.gaji.toLocaleString()}</td>
                </tr>
                <tr><td>Restock ARK</td><td style="text-align:right;">$${r.restock.toLocaleString()}</td></tr>
                <tr><td>Lain-Lain</td><td style="text-align:right;">$${r.expLain.toLocaleString()}</td></tr>
                <tr style="font-weight:bold;"><td>TOTAL OPERASIONAL</td><td style="text-align:right;">$${totalOpr.toLocaleString()}</td></tr>
                
                <tr style="font-weight:bold; color:red;">
                    <td colspan="2">TOTAL</td><td style="text-align:right;">$${netBeforeTax.toLocaleString()}</td>
                </tr>
                <tr style="font-weight:bold;">
                    <td colspan="2">PAJAK 10%</td><td style="text-align:right;">$${pajak.toLocaleString()}</td>
                </tr>
                <tr style="font-weight:bold; color:green; background:#f2fff2;">
                    <td colspan="2">TOTAL PENDAPATAN</td><td style="text-align:right;">$${netFinal.toLocaleString()}</td>
                </tr>
                <tr><td colspan="3" style="background:#eee; height:10px;"></td></tr>`;
            });

            content += `</table>`;
            const blob = new Blob(['\ufeff', content], { type: 'application/msword' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Laporan_GroveGear_Detailed.doc';
            link.click();
        };
    </script>
</body>
</html>
